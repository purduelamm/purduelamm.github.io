<!-- Force desktop layout on all pages (mobile too) -->
{% raw %}{% if page.force_desktop %}{% endraw %}
<script>
(function () {
  // 모바일에서만 동작(데스크톱에선 패스)
  var isMobile = window.matchMedia('(hover: none) and (pointer: coarse)').matches
    || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!isMobile) return;

  var DESKTOP_WIDTH = 1280; // 원하면 1200~1440으로 조정
  var vp = document.querySelector('meta[name="viewport"]');
  if (!vp) { vp = document.createElement('meta'); vp.name = 'viewport'; document.head.appendChild(vp); }

  var deviceW = Math.max(window.innerWidth || 0, window.screen.width || 0);
  var scale = deviceW / DESKTOP_WIDTH;
  if (scale > 1) scale = 1;
  if (scale < 0.25) scale = 0.25;

  vp.setAttribute('content', 'width=' + DESKTOP_WIDTH + ', initial-scale=' + scale + ', user-scalable=yes');
  document.documentElement.classList.add('force-desktop');
})();
</script>
{% raw %}{% endif %}{% endraw %}
